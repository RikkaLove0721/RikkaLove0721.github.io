<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>综合报告</title>
<script>
(function() {
    var t = localStorage.getItem('theme') || 'light';
    if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
})();
</script>
<style>:root {
    --bg: #ffffff;
    --surface: #f5f5f7;
    --surface2: #e8e8ed;
    --text: #1d1d1f;
    --text-muted: #86868b;
    --accent: #007aff;
    --accent-hover: #0056b3;
    --link: #007aff;
    --link-hover: #0056b3;
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.15);
    --code-bg: #f5f5f7;
    --code-color: #c0392b;
    --pre-color: #6c5ce7;
    --table-header-bg: #f5f5f7;
    --hover-bg: rgba(0,0,0,0.03);
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-lg: 0 4px 12px rgba(0,0,0,0.08);
    --blockquote-bg: rgba(0,122,255,0.04);
    --blockquote-border: #007aff;
    --success: #34c759;
    --warning: #ff9500;
    --danger: #ff3b30;
}

:root[data-theme="dark"] {
    --bg: #000000;
    --surface: #1c1c1e;
    --surface2: #2c2c2e;
    --text: #f5f5f7;
    --text-muted: #98989f;
    --accent: #0a84ff;
    --accent-hover: #409cff;
    --link: #0a84ff;
    --link-hover: #409cff;
    --border: rgba(255,255,255,0.1);
    --border-strong: rgba(255,255,255,0.2);
    --code-bg: #1c1c1e;
    --code-color: #f48fb1;
    --pre-color: #ce93d8;
    --table-header-bg: #1c1c1e;
    --hover-bg: rgba(255,255,255,0.04);
    --shadow: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-lg: 0 4px 12px rgba(0,0,0,0.4);
    --blockquote-bg: rgba(10,132,255,0.08);
    --blockquote-border: #0a84ff;
    --success: #30d158;
    --warning: #ff9f0a;
    --danger: #ff453a;
}

* { box-sizing: border-box; }

html { scrollbar-width: none; -ms-overflow-style: none; }
html::-webkit-scrollbar { display: none; }

body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px; line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

.container {
    max-width: 880px;
    margin: 0 auto;
    padding: 40px 24px;
}

/* ===== 主题切换按钮 ===== */
.theme-toggle {
    position: fixed; top: 16px; right: 16px; z-index: 1000;
    padding: 8px 14px; border: 1px solid var(--border);
    border-radius: 999px; background: var(--surface);
    color: var(--text); font-size: 13px; cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    box-shadow: var(--shadow);
}
.theme-toggle:hover { background: var(--hover-bg); border-color: var(--border-strong); }

/* ===== 面包屑 ===== */
.breadcrumb {
    padding: 8px 0; margin-bottom: 24px;
    font-size: 13px; color: var(--text-muted);
}
.breadcrumb a { color: var(--text-muted); text-decoration: none; }
.breadcrumb a:hover { color: var(--link); }
.breadcrumb .sep { margin: 0 8px; opacity: 0.5; }

/* ===== 排版 ===== */
h1 { font-size: 1.8em; font-weight: 700; margin: 0 0 24px; line-height: 1.3; }
h2 { font-size: 1.4em; font-weight: 700; margin: 40px 0 16px; line-height: 1.35; }
h3 { font-size: 1.15em; font-weight: 600; margin: 24px 0 8px; line-height: 1.4; }
h4 { font-size: 1em; font-weight: 600; margin: 16px 0 4px; }

a { color: var(--link); text-decoration: none; }
a:hover { color: var(--link-hover); text-decoration: underline; }

/* ===== 表格 ===== */
table {
    width: 100%; border-collapse: collapse; margin: 16px 0;
    font-size: 13px;
}
th, td {
    padding: 10px 14px; text-align: center;
    border-bottom: 1px solid var(--border);
}
th { background: var(--table-header-bg); font-weight: 600; position: sticky; top: 0; }
tr:hover td { background: var(--hover-bg); }

/* ===== 代码块 ===== */
pre {
    background: var(--code-bg); color: var(--pre-color);
    padding: 16px 20px; border-radius: 10px;
    overflow-x: auto; font-size: 0.88em; line-height: 1.6;
    margin: 16px 0;
    font-family: "SF Mono", "Fira Code", "JetBrains Mono",
                 "Cascadia Code", Consolas, monospace;
}
code {
    background: var(--code-bg); color: var(--code-color);
    padding: 2px 6px; border-radius: 4px; font-size: 0.9em;
}
pre code { background: none; padding: 0; color: inherit; }

/* ===== 引用块 ===== */
blockquote {
    border-left: 3px solid var(--blockquote-border);
    background: var(--blockquote-bg);
    padding: 12px 16px; margin: 16px 0;
    border-radius: 0 6px 6px 0;
    color: var(--text-muted); font-size: 0.95em;
}

/* ===== 高危区块 ===== */
.danger-block {
    border-left: 4px solid var(--danger);
    background: color-mix(in srgb, var(--danger) 6%, transparent);
    padding: 14px 18px; margin: 16px 0;
    border-radius: 0 10px 10px 0;
}
.danger-block::before {
    content: "⚠️ 高危提醒";
    display: block; font-weight: 700; color: var(--danger);
    margin-bottom: 8px; font-size: 0.9em;
}

/* ===== 折叠块 ===== */
.collapsed-links { margin: 8px 0; }
.collapsed-links summary {
    cursor: pointer; font-weight: 600; padding: 8px 0;
    color: var(--text-muted); font-size: 13px;
}
.collapsed-links summary:hover { color: var(--link); }

/* ===== 排行榜 ===== */
.leaderboard-item {
    display: grid; grid-template-columns: 40px 1fr auto 120px;
    align-items: center; gap: 8px;
    padding: 12px 16px; margin: 4px 0;
    border-radius: 10px; text-decoration: none; color: var(--text);
    transition: background 0.15s;
}
.leaderboard-item:hover { background: var(--hover-bg); text-decoration: none; }
.leaderboard-rank { font-weight: 700; font-size: 1.1em; color: var(--text-muted); text-align: center; }
.leaderboard-rank.top3 { color: var(--accent); }
.leaderboard-name { font-weight: 600; }
.leaderboard-count { font-size: 13px; color: var(--text-muted); }
.leaderboard-bar { height: 6px; background: var(--surface2); border-radius: 999px; overflow: hidden; }
.leaderboard-bar-fill {
    height: 100%; background: var(--accent); border-radius: 999px;
    transition: width 0.6s ease;
}

/* ===== 首页卡片 ===== */
.home-section { margin: 32px 0; }
.home-section h2 { margin-bottom: 12px; }
.card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.card {
    background: var(--surface); border-radius: 16px;
    padding: 24px; box-shadow: var(--shadow);
    transition: box-shadow 0.2s, transform 0.2s;
    display: block; color: var(--text); text-decoration: none;
}
.card:hover {
    box-shadow: var(--shadow-lg); transform: translateY(-2px);
    text-decoration: none;
}
.card h3 { margin: 0 0 8px; }
.card p { margin: 0; color: var(--text-muted); font-size: 13px; }
.card-count {
    display: inline-block; margin-top: 12px;
    padding: 3px 10px; border-radius: 999px;
    background: var(--surface2); font-size: 12px; color: var(--text-muted);
}

/* ===== 首页统计 ===== */
.stats-bar {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 12px; margin: 24px 0;
}
.stat-item {
    background: var(--surface); border-radius: 10px;
    padding: 16px; text-align: center; box-shadow: var(--shadow);
}
.stat-num { font-size: 1.5em; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

/* ===== 页脚 ===== */
footer {
    margin-top: 40px; padding: 16px 0;
    border-top: 1px solid var(--border);
    text-align: center; font-size: 12px; color: var(--text-muted);
}
footer a { color: var(--text-muted); }
footer a:hover { color: var(--link); }

/* ===== 响应式 ===== */
@media (max-width: 768px) {
    .container { padding: 16px; }
    .theme-toggle { top: 8px; right: 8px; padding: 6px 10px; font-size: 12px; }
    table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .leaderboard-bar { display: none; }
    .card-grid { grid-template-columns: 1fr; }
    .leaderboard-item { grid-template-columns: 32px 1fr auto; }
}
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙 暗色</button>
<div class="container">
<div class="breadcrumb"><a href="../index.html">首页</a><span class="sep">›</span><span>综合报告</span></div>

<h1>综合报告</h1>

<li><a href="culture.html">RED.25糖渍小番茄 · 群文化与梗传播</a></li>
<li><a href="sensitive.html">RED.25糖渍小番茄 · 敏感内容与边界报告</a></li>

</ul>

<footer>
    <a href="https://github.com/JularDepick/ChatAnalysis.SKILL" target="_blank" rel="noopener noreferrer">
        SKILL技术支持·ChatAnalysis
    </a>
</footer>

</div>
<script>
(function() {
    var btn = document.getElementById('themeToggle');
    if (!btn) return;
    function apply(t) {
        if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            btn.textContent = '☀️ 浅色';
        } else {
            document.documentElement.removeAttribute('data-theme');
            btn.textContent = '🌙 暗色';
        }
    }
    apply(localStorage.getItem('theme') || 'light');
    btn.addEventListener('click', function() {
        var next = localStorage.getItem('theme') === 'dark' ? 'light' : 'dark';
        localStorage.setItem('theme', next);
        apply(next);
    });
})();
</script>
</body>
</html>
